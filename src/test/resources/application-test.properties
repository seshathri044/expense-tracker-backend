# =========================
# Test Database (H2 - No MySQL needed)
# =========================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================
# JPA for H2
# =========================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT (Fake key)
# =========================
jwt.secret.key=thisisthesecretkeyievercreatedinmydevelopmentcareer

# =========================
# Server
# =========================
server.servlet.context-path=/api

# =========================
# Mail - DISABLED during tests (no real emails)
# =========================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.from=test@test.com


# =========================
# Logging - minimal during tests
# =========================
logging.level.com.example.ExpenseTracker=WARN
logging.level.org.springframework.mail=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
