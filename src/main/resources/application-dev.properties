# =========================
# Application Name
# =========================
spring.application.name=ExpenseTracker

# =========================
# Database Configuration
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================
# JPA/Hibernate Configuration
# =========================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT Configuration
# =========================
jwt.secret.key=${JWT_SECRET_KEY}

# =========================
# Server Configuration
# =========================
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =========================
# Email Configuration (Brevo SMTP)
# =========================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Connection settings
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# From email address (must be verified in Brevo account)
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

# Default encoding
spring.mail.default-encoding=UTF-8

# =========================
# Logging Configuration (Development)
# =========================
logging.level.com.example.ExpenseTracker=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================
# Swagger Configuration
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =========================
# CORS Configuration (Development - Allow All)
# =========================
# Configure in SecurityConfig for more control