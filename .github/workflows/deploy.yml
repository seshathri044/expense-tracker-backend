name: Deploy ExpenseTracker to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR and Dockerfile to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,Dockerfile"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Deploy with Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            sudo docker stop expense-tracker-backend || true
            sudo docker rm expense-tracker-backend || true
            sudo docker rmi expense-tracker-backend || true

            sudo docker build -t expense-tracker-backend .

            sudo docker run -d \
              --name expense-tracker-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://172.17.0.1:3306/expensetracker?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true" \
              -e SPRING_DATASOURCE_USERNAME="root" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e SPRING_MAIL_HOST="smtp-relay.brevo.com" \
              -e SPRING_MAIL_PORT="587" \
              -e SPRING_MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
              -e SPRING_MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
              -e SPRING_MAIL_FROM="${{ secrets.MAIL_FROM }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH="true" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE="true" \
              -e SPRING_PROFILES_ACTIVE="prod" \
              -e SERVER_PORT="8080" \
              expense-tracker-backend

            echo "✅ Deployment complete!"
            sleep 15
            sudo docker ps | grep expense-tracker-backend
            echo "📋 Last 30 lines of logs:"
            sudo docker logs --tail=30 expense-tracker-backend